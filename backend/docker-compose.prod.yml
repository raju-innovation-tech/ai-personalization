# Production Docker Compose Configuration
# Usage: docker compose -f docker-compose.prod.yml up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: aip_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aip_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password required}
      POSTGRES_DB: ${POSTGRES_DB:-ai_personalization}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4096M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aip_admin} -d ${POSTGRES_DB:-ai_personalization}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aip_redis_prod
    restart: always
    command: redis-server --appendonly yes --maxmemory 1024mb --maxmemory-policy volatile-lru
    volumes:
      - redis_data_prod:/data
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aip_backend_prod
    restart: always
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4096M
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4 --proxy-headers"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/api/v1/health\")'"]
      interval: 15s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aip_worker_prod
    restart: always
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=4

  nginx:
    image: nginx:alpine
    container_name: aip_nginx_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../deploy/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend

volumes:
  postgres_data_prod:
  redis_data_prod:
