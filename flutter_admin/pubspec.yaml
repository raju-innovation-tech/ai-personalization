name: ai_personalization_admin
description: "AI Personalization & Offer Engine — Admin & Business Intelligence Dashboard"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Networking
  dio: ^5.7.0

  # Routing
  go_router: ^14.6.2

  # Charts
  fl_chart: ^0.69.2

  # Secure local storage (tokens)
  flutter_secure_storage: ^9.2.2

  # Utilities
  intl: ^0.19.0
  logger: ^2.5.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
